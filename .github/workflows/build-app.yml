name: Build spotdl App
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
        force_build:
          description: '既存のリリースがあっても強制的にビルド・更新する'
          type: boolean
          default: false
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Get yt_dlp latest version from PyPI
        id: yt_dlp_version
        run: |
          $response = Invoke-RestMethod -Uri "https://pypi.org/pypi/yt-dlp/json"
          $version = $response.info.version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "yt-dlp latest version: $version"

      - name: Get spotdl latest version from PyPI
        id: spotdl_version
        run: |
          $response = Invoke-RestMethod -Uri "https://pypi.org/pypi/spotdl/json"
          $version = $response.info.version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "spotdl latest version: $version"
          
      - name: Check if release already exists
        id: check_release
        run: |
          $tag = "v${{ steps.spotdl_version.outputs.version }}_ytdlp-${{ steps.yt_dlp_version.outputs.version }}"
          $response = gh release view $tag 2>&1
          if ($LASTEXITCODE -eq 0) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists. Skipping build."
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag not found. Proceeding with build."
          }
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade pip
        if: steps.check_release.outputs.exists == 'false' || github.event.inputs.force_build == 'true'
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        if: steps.check_release.outputs.exists == 'false' || github.event.inputs.force_build == 'true'
        run: |
          pip install --upgrade spotdl pykakasi ytmusicapi
          pip install pyinstaller

      - name: Build with PyInstaller
        if: steps.check_release.outputs.exists == 'false' || github.event.inputs.force_build == 'true'
        run: pyinstaller music-downloader.spec

      - name: Upload artifact
        if: steps.check_release.outputs.exists == 'false' || github.event.inputs.force_build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: music-downloader-windows-spotdl${{ steps.spotdl_version.outputs.version }}_ytdlp${{ steps.yt_dlp_version.outputs.version }}
          path: dist/music-downloader.exe
          retention-days: 30

      - name: Create or update Release
        if: steps.check_release.outputs.exists == 'false' || github.event.inputs.force_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.spotdl_version.outputs.version }}_ytdlp-${{ steps.yt_dlp_version.outputs.version }}
          name: music-downloader v${{ steps.spotdl_version.outputs.version }}_ytdlp-${{ steps.yt_dlp_version.outputs.version }}
          files: dist/music-downloader.exe